# 앱 계층. Jenkins가 EC2에서 빌드하고 같은 호스트에 띄운다 — 배포 경로에 pull이 없다.
# Docker Hub push는 배포가 아니라 롤백용 아카이브다(Verify 통과 뒤에만 올린다).
#
#   IMAGE_TAG=<빌드번호> docker compose -p dero build
#   scripts/deploy-switch.sh              # blue-green 스위치 — 이게 배포다
#
# ⚠ `name:`이 없다. 프로젝트 이름을 **색**이 정하기 때문이다(`-p dero-blue` / `-p dero-green`,
# ADR-0026 결정 3). 파일은 한 벌이고 포트만 갈린다 — 색별로 복제하면 반드시 드리프트하고
# 그 차이는 트래픽이 이미 넘어간 뒤에 드러난다. `-p` 없이 돌리면 프로젝트 이름이 디렉터리명이
# 되므로 항상 `-p`를 붙여라.
#
# postgres·redis는 compose.data.yaml이 소유한다. 여기서는 external 네트워크로만 닿는다.
# 값은 레포 루트 `.env`에서 온다(gitignore). 항목은 .env.example 참고.
# FRONTEND_PORT·BACKEND_PORT만 예외로 deploy-switch.sh가 환경변수로 준다 — 셸 환경이
# `.env`보다 우선한다. 기본값은 blue 색이라 스크립트 없이 띄우면 현행과 같은 포트다.

services:
  frontend:
    image: ${DOCKERHUB_NAMESPACE}/dero-frontend:${IMAGE_TAG}
    build:
      context: ./frontend
      args:
        # 브라우저가 백엔드를 부를 때 쓰는 오리진. NEXT_PUBLIC_* 는 빌드 타임에 번들로 인라인되므로
        # `environment:`가 아니라 여기 build arg로 넣어야 한다(ADR-0005 결정 12).
        # 빈 문자열 = 상대 경로 = 항상 동일 오리진. 도메인을 박으면 호스트가 하나 늘어나는 순간
        # 페이지 오리진과 어긋나 CORS로 전멸한다(2026-08-03 apex A 레코드 장애, deployment.md §4).
        # 서버 컴포넌트는 Node fetch라 상대 경로를 못 받으므로 아래 INTERNAL_API_ORIGIN으로 간다.
        NEXT_PUBLIC_API_BASE_URL: ""
        # 시뮬레이터 카탈로그를 실서버 API로 돌린다 — 기본값 'mock'은 로컬 목업 id로 저장을
        # 쏴서 prod에서 전부 400이다(frontend/Dockerfile 주석 참조).
        NEXT_PUBLIC_API_MODE: real
        # GA4 Measurement ID — 비밀값이 아니라 루트 .env에서 그대로 보간한다. 없으면 빈 문자열이
        # 박혀 GA가 비활성화된다(frontend/Dockerfile 주석 참조).
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    environment:
      # 서버 컴포넌트(RSC)가 렌더 중에 부르는 오리진. 런타임 env다 — NEXT_PUBLIC_이 아니라
      # 번들에 인라인되지 않고 브라우저로도 새지 않는다. 호스트명은 이 파일의 서비스명이며
      # 같은 default 네트워크에서 별칭으로 해석된다(포트는 컨테이너 내부 8080, 호스트 8081 아님).
      # 정적 생성이 없어(약관·제품 페이지 모두 revalidate 동적 렌더) 빌드 타임에는 부르지 않는다.
      INTERNAL_API_ORIGIN: http://backend:8080
    restart: unless-stopped
    ports:
      # `127.0.0.1`을 명시한다. 종전 `"3000:3000"`은 0.0.0.0 바인딩이라 nginx·TLS를 우회해
      # 평문으로 열려 있었다(deployment.md §7). 색이 늘면 열린 포트도 늘므로 여기서 닫는다.
      # nginx는 upstream으로 127.0.0.1에 붙으니 서비스에는 영향이 없다.
      #
      # ⚠ 호스트 IP를 빼면 방화벽이 있어도 그 순간 인터넷에 열린다. ufw가
      # `default deny (incoming)`인데도 3000·8081이 외부에서 뚫렸다 — Docker publish는
      # nat/PREROUTING에서 DNAT되어 ufw의 filter/INPUT보다 먼저 처리된다(실측 2026-08-06).
      # **이 `127.0.0.1:`이 보조 방어가 아니라 유일한 방어다.** 새 포트를 publish할 때마다 붙여라.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # 실측 87 MiB(2026-08-06). 상한이지 목표가 아니다 — 근거는 backend 쪽 주석.
    mem_limit: 512m

  backend:
    image: ${DOCKERHUB_NAMESPACE}/dero-backend:${IMAGE_TAG}
    build:
      context: ./backend/dero-api
    restart: unless-stopped
    ports:
      # deploy-switch.sh가 스위치 전에 **아직 트래픽이 없는 색**의 이 포트로
      # /api/actuator/health를 친다(ADR-0026 결정 6). frontend와 같은 이유로 127.0.0.1 바인딩.
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    # 제한이 없으면 JVM이 **호스트 전체**를 기준으로 힙 상한을 잡는다 — 실측 `MaxHeapSize`가
    # 3.9 GiB였다(MaxRAMPercentage 25% × 15.6 GiB). blue-green은 색 두 벌이 겹치므로 백엔드
    # 둘이 각자 3.9 GiB를 자기 몫으로 믿고, 합치면 여유 8.1 GiB를 넘긴다. swap이 0이라
    # 초과는 지연이 아니라 OOM kill이고 **커널이 고르는 희생자가 서비스 중인 색일 수 있다.**
    #
    # 값을 걸면 JDK 21이 cgroup 한도를 읽어 힙 상한이 512 MiB로 따라 내려간다.
    # 실측(2026-08-06): RSS 699 MiB · heap used 138 / committed 288 · nonheap used 238 MiB.
    # 한도에 닿으면 호스트가 아니라 이 컨테이너만 죽는다 — blue-green에서는 그게 맞는
    # 방향이다(스위치 전 헬스 게이트가 잡는다). 근거: ADR-0026 선행 조건 2.
    mem_limit: 2g
    environment:
      # 호스트명은 compose.data.yaml의 서비스명이다(네트워크 별칭으로 해석된다).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      # 검색 인덱스. compose.observability.yaml의 서비스명이 dero-data 네트워크 별칭으로 해석된다.
      # ⚠ 그 파일은 Jenkins가 적용하지 않는다 — ES가 안 떠 있으면 검색 API만 503이고
      # 카탈로그·상세는 그대로 산다(ADR-0019 결정 6).
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_PROFILES_ACTIVE: prod
      # 시크릿은 루트 `.env`에서 보간된다. 컨테이너가 런타임에 읽는 값이라 Jenkins credential이 아니다(ADR-0010).
      # 이름을 그대로 통과시킨다 — 바인딩은 application-prod.yaml의 ${OAUTH_*} placeholder가 한다
      # (AWS_* 4종과 같은 결. 완화 바인딩으로 yaml 밖에서 몰래 붙지 않게 한다).
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:?OAUTH_KAKAO_CLIENT_ID is required}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:?OAUTH_KAKAO_CLIENT_SECRET is required}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:?OAUTH_GOOGLE_CLIENT_ID is required}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:?OAUTH_GOOGLE_CLIENT_SECRET is required}
      # 기본값을 두지 않는다. 빈 값이면 짧은 더미 키로 조용히 떠서 `secret length must be at
      # least 256 bits`로 한참 뒤에 죽는다 — 없으면 compose 단계에서 바로 멈추는 게 낫다(실측).
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # S3 버킷·리전·자격증명. compose.yaml이 Spring 표준 키로 보간한다(ADR-0010).
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # 상상도 생성(GMS 프록시) 키. `:?`를 쓰지 않는다 — 기본값이 여전히 mode=stub이라 키 없이도
      # 정상 배포돼야 한다. mode를 gms로 켜면 그때 앱이 기동 단계에서 막는다.
      GMS_API_KEY: ${GMS_API_KEY:-}
      IMAGE_GENERATION_BASE_URL: ${IMAGE_GENERATION_BASE_URL:-https://api.openai.com}
      # 상상도 생성 on/off와 요청 방식을 `.env` 두 줄로 가른다 — 코드 수정·이미지 재빌드 없이
      # 켜고(gms) 끄고(stub), multipart가 막히면 generations로 강등한다(DERO-358).
      IMAGE_GENERATION_MODE: ${IMAGE_GENERATION_MODE:-stub}
      IMAGE_GENERATION_REQUEST_TYPE: ${IMAGE_GENERATION_REQUEST_TYPE:-edits}

    networks:
      - default
      - dero-data

networks:
  dero-data:
    external: true
