# ArchUnit 설정 — ADR-0012 컨벤션 기계 강제
#
# freeze(동결) 전략: 감사 시점에 이미 존재하는 위반은 baseline에 기록해 통과시키고,
# 그 이후 새로 들어오는 위반만 실패시킨다. 목적은 "지금 코드를 다 고치는 것"이 아니라
# "오늘부터 새 위반을 막는 것"이다. 기존 위반 정리는 별도 티켓이 맡는다.
#
# 위반이 0인 규칙은 freeze하지 않는다 — baseline이 나중의 회귀를 흡수해버릴 위험이 있다.

# baseline 파일이 없으면 첫 실행에서 만든다. (없으면 첫 실행이 그냥 실패한다)
freeze.store.default.allowStoreCreation=true

# 위반이 줄면 baseline을 자동으로 줄인다 — 한 번 고친 위반이 되돌아오면 다시 실패한다.
freeze.store.default.allowStoreUpdate=true

# baseline 저장 위치. Gradle test의 작업 디렉터리는 backend/dero-api다.
# src/test/resources 아래에 둬서 git에 커밋된다 — baseline은 리뷰 대상이다.
freeze.store.default.path=src/test/resources/archunit_store
