# 데이터 계층. 앱 배포와 생명주기를 분리한다 — compose.yaml이 도는 `dero` 프로젝트의
# `--remove-orphans`가 여기 컨테이너를 걷어가지 못하게 프로젝트를 나눴다.
#
#   docker compose -f compose.data.yaml up -d      (EC2에서 최초 1회. 배포 때는 건드리지 않는다)
#
# `dero-data` 네트워크를 여기서 만든다. compose.yaml은 external로 붙는다.

name: dero-data

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PG18부터 이미지의 데이터 경로가 /var/lib/postgresql/data가 아니다
      # (PGDATA=/var/lib/postgresql/18/docker). 튜토리얼대로 /data에 마운트하면
      # 데이터가 볼륨 밖에 남아 컨테이너를 지울 때 사라진다.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # 로컬 개발용 — 호스트에서 도는 앱이 붙는다(application-local.yaml).
      # 127.0.0.1 바인딩이라 EC2에서도 외부에 안 열린다. 컨테이너 앱은 네트워크 별칭으로 붙으므로 무관.
      - '127.0.0.1:5432:5432'
    networks: [dero-data]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      # 리프레시 토큰이 여기 산다(ADR-0005). 볼륨이 없으면 컨테이너를 다시 만들 때
      # 전 사용자가 재로그인해야 한다.
      - redis-data:/data
    ports:
      # 로컬 개발용 — postgres와 같은 이유로 127.0.0.1 바인딩.
      - '127.0.0.1:6379:6379'
    networks: [dero-data]

volumes:
  postgres-data:
  redis-data:

networks:
  dero-data:
    # 명시하지 않으면 `dero-data_dero-data`로 만들어져 external 참조가 어긋난다.
    name: dero-data
