# 대시보드 프로비저닝 공급자. JSON 파일을 마운트 경로에서 읽어 올린다 —
# 컨테이너를 다시 만들어도 대시보드가 그대로 살아 있고, 정의는 레포가 정본이다.

apiVersion: 1

providers:
  - name: dero
    type: file
    # UI에서 수정하고 저장하면 파일과 갈린다 — 정본은 레포다.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      # 폴더 구조를 Grafana 폴더로 그대로 옮긴다.
      foldersFromFilesStructure: false
