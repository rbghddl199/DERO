# Grafana 데이터소스 프로비저닝. UI 클릭 대신 파일로 둔다 — Jenkins가 관측 계층을 안 건드리므로
# (deployment.md §5) 수동 재적용이 잦고, 그때마다 손으로 다시 만들면 설정이 흔들린다.
# `deleteDatasources`는 두지 않는다 — 이 파일이 유일한 정의라 지울 것이 없다.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # 대시보드 JSON이 이 uid로 데이터소스를 가리킨다 — 고정하지 않으면 Grafana가 임의값을 만들고
    # 프로비저닝된 대시보드의 패널이 전부 "Datasource not found"가 된다.
    uid: dero-prometheus
    access: proxy
    # 같은 compose 프로젝트의 default 네트워크에서 서비스명으로 해석된다.
    url: http://prometheus:9090
    isDefault: true
    editable: false
