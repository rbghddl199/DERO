# blue 색 업스트림. `active.conf` 심볼릭 링크가 이 파일을 가리키면 blue가 서비스 중이다.
# 배포 스크립트(scripts/deploy-switch.sh)가 레포에서 /var/lib/dero/nginx/ 로 복사하므로
# 이 파일이 정본이다 — 호스트 사본을 손으로 고치지 마라. 다음 배포가 덮는다.
# 근거: docs/adr/0026-blue-green-deploy-and-expand-contract-migration.md 결정 2

upstream dero_frontend {
    server 127.0.0.1:3000;
}

upstream dero_backend {
    server 127.0.0.1:8081;
}
