# EC2 호스트 /etc/nginx/sites-available/dero 의 사본. nginx 1.24.0 Ubuntu.
#
# ⚠ 정본은 호스트 실물이다. 이 파일은 자동 동기화되지 않는다 — 사람이 양쪽을 맞춘다.
#    드리프트 확인: sudo diff ~/dero/infra/nginx/dero.conf /etc/nginx/sites-available/dero
#
# **2026-08-11 기준 실물과 차이 없다**(`nginx -T`로 대조). 각 자리의 티켓 번호는 그 줄이 언제 왜
# 들어왔는지를 남긴 이력이지 "아직 적용 안 됨" 표시가 아니다 — 383(actuator deny)·442(http2·TLS·
# HSTS·본문 상한)·571(이미지 캐시 2블록, ADR-0035) 전부 호스트에 있다. **HSTS는 되돌리기가 사실상
# 불가능하니**(아래 블록 주석) "미적용이겠거니" 하고 재적용하지 말고 위 드리프트 확인부터 돌린다.
# 새로 벌어진 차이가 생기면 그때 이 줄을 다시 쓴다.
# 적용·검증·되돌리기 절차는 같은 폴더 README.md, 라우팅 설계 근거는 docs/context/deployment.md §4.

# [442] WebSocket 업그레이드는 요청이 실제로 요구할 때만 전달한다.
# 원래 세 location이 `Connection "upgrade"`를 무조건 붙여서, 일반 요청에도 업그레이드 의사가
# 실려 업스트림 keep-alive가 매 요청 끊겼다. 빈 Upgrade 헤더는 close로 접는다.
# map은 http 컨텍스트 지시어다 — 이 파일이 http {} 안에 include되므로 여기가 맞는 자리다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# [571] 이미지 안정 공개 URL(ADR-0035)의 캐시 저장소. proxy_cache_path는 http 컨텍스트
# 지시어다 — 이 파일이 http {} 안에 include되므로 여기가 맞는 자리다(위 map과 같은 이유).
# 캐시 유효기간은 지시어가 아니라 업스트림 Cache-Control(immutable, 1년)이 정한다.
# 호스트 선행 조건: 부모 `/var/cache/nginx`가 있어야 한다. **Ubuntu nginx 패키지는 만들어 두지
# 않는다**(2026-08-11 실측 — 없었다). 적용 전에 한 번:
#   sudo install -d -o www-data -g www-data -m 0700 /var/cache/nginx/dero_images
proxy_cache_path /var/cache/nginx/dero_images levels=1:2 keys_zone=dero_images:10m
                 max_size=2g inactive=30d use_temp_path=off;

# [0026] blue-green 스위치. 이 링크가 가리키는 파일이 곧 현재 색이고, 배포는 링크를 바꾼 뒤
# reload하는 것이 전부다(scripts/deploy-switch.sh). 링크를 /etc/nginx 밖에 두는 이유는
# 배포 계정에 이 디렉터리 쓰기 권한을 주지 않기 위해서다 — 같은 nginx가 TLS와 Jenkins 입구를
# 겸하므로 배포 스크립트가 자기 접근 경로를 깰 수 있다. ADR-0026 결정 2.
#
# ⚠ 이 파일이 없으면 nginx가 아예 안 뜬다. 호스트 선행 조건은 deploy-switch.sh 헤더 참조.
include /var/lib/dero/nginx/active.conf;

# 1) HTTP — 한 번에 https + www로 정규화 (기존엔 $host라 apex는 2홉이 됐다)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dero.life www.dero.life;

    return 301 https://www.dero.life$request_uri;
}

# 2) HTTPS apex — 정규 호스트로 보낸다. 이 블록이 첫 443 블록이라
#    Host 헤더가 없거나 IP로 직접 들어온 요청도 여기로 떨어져 www로 간다.
server {
    # [442] http2. nginx 1.24에는 `http2 on;` 지시어가 없다(1.25.1에서 생겼다) —
    # 이 버전에서는 listen 파라미터로 켜는 것이 유일한 방법이다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dero.life;

    ssl_certificate /etc/letsencrypt/live/dero.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dero.life/privkey.pem;

    # [442] TLS 공통 설정. certbot의 options-ssl-nginx.conf를 include하지 않는다 —
    # DNS-01 certonly로 발급했어서 그 파일이 있는지 확인되지 않았고, 없는 파일을 include하면
    # nginx -t가 실패한다. 값을 여기 적어 두면 무엇이 켜져 있는지도 파일에서 보인다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # [442] HSTS. ⚠ 되돌리기가 사실상 불가능하다 — 브라우저가 max-age 동안 http 접근을
    # 자체 차단하므로, 인증서 갱신이 실패하면 사이트가 통째로 안 열린다. includeSubDomains는
    # 넣지 않는다(grafana 등 서브도메인에 아직 인증서가 없다). README의 적용 순서를 볼 것.
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://www.dero.life$request_uri;
}

# 3) HTTPS 정규 호스트 — 실제 서비스. 기존 블록에서 server_name만 www로 바꾼 것.
server {
    listen 443 ssl http2;                                     # [442]
    listen [::]:443 ssl http2;                                # [442]
    server_name www.dero.life;

    ssl_certificate /etc/letsencrypt/live/dero.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dero.life/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;                            # [442]
    ssl_prefer_server_ciphers off;                            # [442]
    ssl_session_cache shared:SSL:10m;                         # [442]
    ssl_session_timeout 1d;                                   # [442]
    ssl_session_tickets off;                                  # [442]

    add_header Strict-Transport-Security "max-age=31536000" always;   # [442]

    # [442] 기본값 1MB를 명시값으로 올린다. 지금은 업로드가 브라우저 → S3 presigned URL 직행이라
    # nginx 경로에 큰 본문이 없지만, app.storage.mode=local로 되돌리면 파일이 이 경로를 지난다
    # (backend/dero-api/CLAUDE.md). 상한이지 목표가 아니다.
    client_max_body_size 20m;

    # [383] 지표 수집기는 도커 네트워크로 backend:8080을 직접 긁으므로 이 deny는 수집에 영향이 없고,
    # 인터넷에서 오는 요청만 막는다. `=` 정확 일치가 접두사 location /api/ 보다 항상 우선하므로
    # 블록 순서와 무관하다. 근거: docs/adr/0020-observability-stack.md 결정 4
    location = /api/actuator/prometheus {
        deny all;
        access_log off;
    }

    # [571] 이미지 안정 공개 URL(ADR-0035). ^~ 접두사 매치가 아래 location /api/ 보다 우선한다.
    # 캐시 히트면 WAS·S3에 안 간다. 유효기간은 업스트림 Cache-Control(immutable, 1년)이 정하고,
    # key가 업로드마다 uuid라 무효화가 필요한 경우가 없다. WebSocket 헤더는 이미지에 낄 일이 없어 뺐다.
    location ^~ /api/v1/images/ {
        proxy_pass http://dero_backend;                       # [0026] 색은 upstream이 정한다

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache dero_images;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/ {
        proxy_pass http://dero_backend;                       # [0026] 색은 upstream이 정한다

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;      # [442]
    }

    location / {
        proxy_pass http://dero_frontend;                      # [0026] 색은 upstream이 정한다

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;      # [442]
    }

    # proxy_pass 끝에 슬래시가 없다 — 접두사 /project/ 를 그대로 Jenkins에 넘긴다.
    # 슬래시를 붙여 접두사를 떼면 Jenkins가 뿌리는 절대 경로(/static/...)가 location / 에 걸려
    # 프론트로 새 나간다(deployment.md §4·§6).
    location /project/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
